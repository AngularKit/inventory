name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test du binaire compilé
        run: node dist/cli.js fixture --quiet --json "$RUNNER_TEMP/inv.json" && test -s "$RUNNER_TEMP/inv.json"
      - name: Vérifie le contenu du paquet npm
        run: npm pack --dry-run
