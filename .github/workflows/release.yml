name: Release

# Pipeline 100 % automatique, piloté par release-please :
#   1. À chaque push sur main, release-please lit les commits conventionnels
#      (feat:, fix:, feat!: …) et ouvre/met à jour une PR « chore(main): release X.Y.Z »
#      qui bump package.json et CHANGELOG.md.
#   2. Quand cette PR est mergée, release-please crée le tag vX.Y.Z et la GitHub Release.
#   3. Le job publish (même workflow, car un tag créé par GITHUB_TOKEN ne déclenche
#      pas d'autre workflow) teste, build et publie sur npm avec provenance.
#
# Auth npm : Trusted Publishing (OIDC) une fois le paquet existant, sinon secret NPM_TOKEN.
# Pré-requis GitHub, au choix (cf. README « Publier une version ») :
#   - secret RELEASE_PLEASE_TOKEN (PAT fine-grained : Contents + Pull requests en écriture),
#     recommandé car une PR ouverte avec GITHUB_TOKEN ne déclenche pas la CI ;
#   - ou « Allow GitHub Actions to create and approve pull requests » activé
#     au niveau de l'organisation puis du repo.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    name: Publier sur npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # upload du .tgz sur la release
      id-token: write # OIDC pour Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: npm ≥ 11.5 (requis pour Trusted Publishing)
        run: npm install -g npm@latest && npm -v
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publier (provenance activée via publishConfig)
        run: npm publish
        env:
          # Vide si le secret n'existe pas → npm bascule sur OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Joindre le tarball à la GitHub Release
        run: npm pack && gh release upload "$TAG" ./*.tgz --clobber
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
